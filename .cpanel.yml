---
# cPanel Git Version Control deployment.
# 3dorthotics.com's real document root is ~/3dorthotics.com/main_page
# (confirmed in cPanel -> Domains). Deploy the current build there.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/3dorthotics.com/main_page
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -R ./* "$DEPLOYPATH/"
    - /bin/cp -f ./.htaccess "$DEPLOYPATH/"
    - /bin/rm -rf "$DEPLOYPATH/CLAUDE.md" "$DEPLOYPATH/DEPLOYMENT.md" "$DEPLOYPATH/README.md" "$DEPLOYPATH/lab.html" "$DEPLOYPATH/Web Dev Team"
