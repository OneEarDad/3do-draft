---
# cPanel Git Version Control deployment.
# Deploys the current build to the 3dorthotics.com document root (add-on
# domain: ~/3dorthotics.com). Copies the site + our .htaccess (which replaces
# the dormant WordPress .htaccess), then removes dev-only files from the live
# root. Leftover WordPress files (wp-content, etc.) are left in place.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/3dorthotics.com
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -R ./* "$DEPLOYPATH/"
    - /bin/cp -f ./.htaccess "$DEPLOYPATH/"
    - /bin/rm -rf "$DEPLOYPATH/CLAUDE.md" "$DEPLOYPATH/DEPLOYMENT.md" "$DEPLOYPATH/README.md" "$DEPLOYPATH/lab.html" "$DEPLOYPATH/Web Dev Team"
