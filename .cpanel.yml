---
# cPanel Git Version Control deployment.
# Runs when you click "Deploy HEAD Commit" in cPanel -> Git Version Control.
# Copies the site into the temp-newSite folder (including .htaccess, which
# turns on gzip compression + the redirects).
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/3dorthotics.com/temp-newSite
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -R ./* "$DEPLOYPATH/"
    - /bin/cp -f ./.htaccess "$DEPLOYPATH/"
